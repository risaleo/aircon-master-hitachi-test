  <text x="85" y="462" font-family="sans-serif" font-size="22" fill="#587086">室外機の台数を減らしやすい</text>

  <rect x="625" y="165" width="520" height="330" rx="28" fill="#ffffff" stroke="#b8cee2" stroke-width="4"/>
  <text x="655" y="215" font-family="sans-serif" font-size="30" font-weight="700" fill="#0b315f">通常のルームエアコン</text>
  <rect x="675" y="270" width="170" height="95" rx="18" fill="#e8f3ff" stroke="#5a9be8" stroke-width="3"/>
  <rect x="915" y="270" width="170" height="95" rx="18" fill="#e8f3ff" stroke="#5a9be8" stroke-width="3"/>
  <text x="703" y="328" font-family="sans-serif" font-size="24" font-weight="700" fill="#14324f">室外機</text>
  <text x="943" y="328" font-family="sans-serif" font-size="24" font-weight="700" fill="#14324f">室外機</text>
  <rect x="705" y="390" width="110" height="70" rx="12" fill="#fff" stroke="#7a93aa" stroke-width="3"/>
  <rect x="945" y="390" width="110" height="70" rx="12" fill="#fff" stroke="#7a93aa" stroke-width="3"/>
  <line x1="760" y1="365" x2="760" y2="390" stroke="#2f77d0" stroke-width="7"/>
