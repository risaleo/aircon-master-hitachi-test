  <text x="718" y="434" font-family="sans-serif" font-size="18" fill="#14324f">室内機</text>
  <text x="958" y="434" font-family="sans-serif" font-size="18" fill="#14324f">室内機</text>
  <text x="655" y="462" font-family="sans-serif" font-size="22" fill="#587086">室内機1台につき室外機1台</text>

  <rect x="55" y="535" width="1090" height="300" rx="28" fill="#ffffff" stroke="#b8cee2" stroke-width="4"/>
  <text x="85" y="585" font-family="sans-serif" font-size="30" font-weight="700" fill="#0b315f">交換・受付時の重要確認</text>
  <g font-family="sans-serif" font-size="24" fill="#14324f">
    <text x="90" y="640">✓ 現在の室内機・室外機の型番と接続台数</text>
    <text x="90" y="688">✓ 接続可能な組み合わせ・合計能力</text>
    <text x="90" y="736">✓ 配管長・高低差・配管径・隠ぺい配管の状態</text>
    <text x="90" y="784">✓ 電源位置・設置場所の写真・室外機故障時の影響</text>
  </g>
  <rect x="730" y="615" width="360" height="160" rx="20" fill="#fff4df" stroke="#e0a83d" stroke-width="3"/>
  <text x="755" y="655" font-family="sans-serif" font-size="24" font-weight="700" fill="#8a5a00">注意</text>
