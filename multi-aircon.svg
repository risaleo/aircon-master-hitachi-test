  <line x1="355" y1="290" x2="465" y2="235" stroke="#2f77d0" stroke-width="8"/>
  <line x1="355" y1="335" x2="465" y2="390" stroke="#2f77d0" stroke-width="8"/>
  <rect x="450" y="195" width="90" height="80" rx="12" fill="#fff" stroke="#7a93aa" stroke-width="3"/>
