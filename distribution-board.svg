<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#173b66}.t{font-size:34px;font-weight:800}.h{font-size:23px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#7da4c8;stroke-width:3}.warn{fill:#fff4df;stroke:#df9b2e;stroke-width:3}.line{stroke:#3478d4;stroke-width:7;fill:none}.dash{stroke:#e68b3c;stroke-width:6;fill:none;stroke-dasharray:12 9}</style><rect width="1200" height="850" fill="#f3f8fc"/><text x="55" y="70" class="t">分電盤：設置可否は1か所だけで判断しない</text><rect x="55" y="115" width="330" height="600" rx="24" class="box"/><text x="85" y="165" class="h">分電盤の構成</text><rect x="95" y="205" width="250" height="95" rx="14" class="warn"/><text x="120" y="245" class="h">主幹ブレーカー</text><text x="120" y="275" class="b">家全体の容量</text><rect x="95" y="330" width="110" height="90" rx="12" class="box"/><rect x="230" y="330" width="110" height="90" rx="12" class="box"/><text x="110" y="370" class="b">分岐</text><text x="245" y="370" class="b">分岐</text><rect x="95" y="455" width="245" height="100" rx="12" class="box"/><text x="112" y="495" class="h">エアコン専用回路</text><text x="112" y="530" class="b">100V / 200V</text><text x="85" y="610" class="b">空き回路・表示・容量を確認</text><rect x="430" y="115" width="710" height="270" rx="24" class="box"/><text x="470" y="165" class="h">100V → 200V変更で確認</text><text x="480" y="215" class="b">① 単相3線式か　② 専用回路か　③ 配線が対応するか</text><text x="480" y="260" class="b">④ 分岐ブレーカー　⑤ コンセント形状　⑥ 希望機種</text><path d="M465 315 H1090" class="line"/><text x="480" y="350" class="b">契約アンペアやブレーカー容量だけでは断定しない</text><rect x="430" y="420" width="710" height="295" rx="24" class="warn"/><text x="470" y="470" class="h">店頭で欲しい写真</text><text x="480" y="520" class="b">✓ 分電盤の扉を閉じた全体</text><text x="480" y="565" class="b">✓ 扉を開けたブレーカー全体</text><text x="480" y="610" class="b">✓ 主幹・分岐の文字が読める近接</text><text x="480" y="670" class="b">新規増設は分電盤から室内機までの配線経路も確認</text></svg>