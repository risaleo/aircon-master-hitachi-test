<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#173b66}.t{font-size:34px;font-weight:800}.h{font-size:23px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#7da4c8;stroke-width:3}.warn{fill:#fff4df;stroke:#df9b2e;stroke-width:3}.line{stroke:#3478d4;stroke-width:7;fill:none}.dash{stroke:#e68b3c;stroke-width:6;fill:none;stroke-dasharray:12 9}</style><rect width="1200" height="850" fill="#f3f8fc"/><text x="55" y="70" class="t">化粧カバー：本数ではなく経路と部材で考える</text><rect x="55" y="115" width="520" height="270" rx="24" class="box"/><text x="90" y="165" class="h">室内化粧カバー</text><path d="M110 230 H380 Q450 230 450 300 V335" class="line"/><text x="90" y="360" class="b">直管・曲がり・端末部材</text><rect x="625" y="115" width="520" height="270" rx="24" class="box"/><text x="660" y="165" class="h">室外化粧カバー</text><path d="M690 225 V330 H1040" class="dash"/><text x="660" y="360" class="b">紫外線・雨・外観から配管を保護</text><rect x="55" y="425" width="520" height="315" rx="24" class="warn"/><text x="90" y="475" class="h">見積に必要</text><text x="100" y="525" class="b">✓ 色　✓ 長さ　✓ 曲がり数</text><text x="100" y="570" class="b">✓ 穴位置　✓ 室外機位置</text><text x="100" y="615" class="b">✓ 2階→1階・高所条件</text><text x="100" y="675" class="b">「カバー一式」では確定しない</text><rect x="625" y="425" width="520" height="315" rx="24" class="box"/><text x="660" y="475" class="h">既存カバー再利用</text><text x="670" y="525" class="b">サイズ・割れ・変色・固定状態</text><text x="670" y="570" class="b">新しい配管束が収まるか</text><text x="670" y="615" class="b">本体や穴位置変更がないか</text><text x="670" y="675" class="b">再利用不可なら新設の概算も案内</text></svg>