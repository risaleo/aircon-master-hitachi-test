<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="850" viewBox="0 0 1200 850"><style>text{font-family:-apple-system,BlinkMacSystemFont,"Noto Sans JP",sans-serif;fill:#173b66}.t{font-size:34px;font-weight:800}.h{font-size:23px;font-weight:700}.b{font-size:18px}.box{fill:#fff;stroke:#7da4c8;stroke-width:3}.warn{fill:#fff4df;stroke:#df9b2e;stroke-width:3}.line{stroke:#3478d4;stroke-width:7;fill:none}.dash{stroke:#e68b3c;stroke-width:6;fill:none;stroke-dasharray:12 9}</style><rect width="1200" height="850" fill="#f3f8fc"/><text x="55" y="70" class="t">隠ぺい配管：同じメーカー・同じ畳数でも断定しない</text><rect x="55" y="115" width="1090" height="190" rx="24" class="box"/><rect x="95" y="155" width="230" height="90" rx="14" class="box"/><text x="145" y="210" class="h">室内機</text><path d="M325 200 H865" class="line"/><path d="M325 225 H865" class="dash"/><rect x="865" y="155" width="230" height="90" rx="14" class="box"/><text x="915" y="210" class="h">室外機</text><text x="390" y="180" class="b">冷媒配管・連絡線</text><text x="390" y="260" class="b">ドレン配管（壁内）</text><rect x="55" y="350" width="520" height="390" rx="24" class="box"/><text x="90" y="400" class="h">再利用判断</text><text x="100" y="450" class="b">✓ 配管径・長さ・高低差</text><text x="100" y="495" class="b">✓ 劣化・つぶれ・漏れ</text><text x="100" y="540" class="b">✓ 連絡線の本数・太さ・長さ</text><text x="100" y="585" class="b">✓ ドレン勾配・詰まり・排水先</text><text x="100" y="630" class="b">✓ 換気・加湿ホース等の制限</text><text x="100" y="690" class="b">写真だけで確定できない場合は現地調査</text><rect x="625" y="350" width="520" height="390" rx="24" class="warn"/><text x="660" y="400" class="h">再利用できない場合</text><text x="670" y="455" class="b">・配管洗浄 / 延長</text><text x="670" y="505" class="b">・露出配管へ変更</text><text x="670" y="555" class="b">・適合する機種へ変更</text><text x="670" y="605" class="b">・工事不可 / 現地再判断</text><text x="670" y="675" class="b">お客様には概算と未確定条件を分けて説明</text></svg>